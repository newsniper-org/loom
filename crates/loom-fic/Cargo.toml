[package]
name = "loom-fic"
edition.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
name = "loom_fic"

[[bin]]
name = "loom-fic-sidecar"
path = "src/bin/sidecar.rs"

[[bin]]
name = "isr-bench"
path = "src/bin/isr_bench.rs"

[dependencies]
bevy_ecs.workspace = true
# No "wasm_js" feature: that backend itself depends on wasm-bindgen/js-sys
# (calls `crypto.getRandomValues`), which would drag JS-glue imports back
# into the wasm32 build this crate exists to keep JS-free (see lib.rs's
# `__getrandom_v03_custom` doc comment for the custom backend used instead,
# active via `RUSTFLAGS='--cfg getrandom_backend="custom"'`).
getrandom = { workspace = true }
loom-runtime = { path = "../loom-runtime" }
# Task #28-c — resumability_payload/assets 와이어 포맷. bincode가 아니라 JSON을
# 고른 이유: docs/05의 FIC 자체가 "언어가 다른 백엔드"(Python ctypes, Node.js
# sidecar 등, examples/ 참고)를 명시적으로 요구조건에 넣고 있어, 소비자가
# Rust여야 한다는 전제가 없다 — bincode는 스키마를 아는 Rust 쪽 디코더가 있어야
# 읽을 수 있지만, JSON은 어떤 언어에서든 표준 라이브러리만으로 파싱 가능하다.
# serde/serde_json 둘 다 순수 Rust(wasm-bindgen 의존 없음)라 이 크레이트의
# "JS-glue-free wasm32 빌드" 원칙(위 getrandom 주석 참고)을 안 깬다.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
loom-compiler = { path = "../loom-compiler" }