# RQ5 후보 #4의 "검증된 코드 = 배포되는 코드"를 성립시키기 위한 크레이트.
#
# loom-runtime 안에 두지 않고 분리한 이유: `cargo verus verify`는 크레이트
# 전체를 검증 대상으로 보는데, loom-runtime은 bevy_ecs/web-sys와 얽혀 있어
# Verus가 추론할 수 없는 코드가 대부분이다. 순수 알고리즘만 담은 크레이트를
# 따로 두면 그 전체를 검증할 수 있고, loom-runtime은 이것을 호출만 한다.
#
# vstd 의존은 wasm32-unknown-unknown에서도 문제없이 빌드된다(ghost 코드가
# 컴파일 시점에 지워지므로 런타임 짐이 없음 — 실측 확인).
[package]
name = "loom-flush-core"
edition.workspace = true
version.workspace = true

[dependencies]
# **검증과 빌드가 서로 다른 vstd를 쓴다(2026-08-01, 의도된 분리)**:
#
#  - **검증**: `verus --crate-type=lib crates/loom-flush-core/src/lib.rs`
#    (Makefile 대신 README에 명령을 적어 둠). Verus 바이너리에 **번들된** vstd를
#    자동으로 쓰므로 바이너리와 짝이 반드시 맞는다.
#  - **빌드**: 아래 crates.io 의존. ghost가 소거된 뒤 실체로 남는 것은
#    `HashMapWithView`(std HashMap 얇은 래퍼)뿐이다.
#
# `cargo verus verify`를 쓰지 않는 이유: 업스트림 최신 Verus는 crates.io의 어떤
# vstd 릴리스보다 앞서 있어(버전 문자열이 같아도 내용이 다름) 바이너리가
# `unexpected verus diagnostic item`으로 거부한다. 설치본을 path로 가리키는 것도
# 막힌다 — 설치 디렉터리에 워크스페이스 루트가 없어 `builtin_macros` 등의
# `{ workspace = true }` 상속이 풀리지 않고, `/opt/verus`는 쓰기 불가다.
#
# 이 분리가 안는 가정 하나(명시): 두 vstd의 `HashMapWithView` 런타임 동작이
# 같다는 것. 둘 다 `std::collections::HashMap`을 감싼 얇은 래퍼이고, API가
# 어긋나면 빌드가 **시끄럽게** 실패하므로 조용한 불일치는 생기지 않는다.
vstd = "=0.0.0-2026-07-12-0122"

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)'] }
