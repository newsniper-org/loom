[package]
name = "loom-island-quantitypicker"
edition.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy_ecs.workspace = true
console_error_panic_hook = "0.1.7"
getrandom = { workspace = true, features = ["wasm_js"] }
loom-runtime = { path = "../loom-runtime", features = ["browser"] }
wasm-bindgen = "0.2.126"
web-sys = { version = "0.3.103", features = ["Document", "Element", "Window", "Node", "HtmlElement", "HtmlCollection", "Event", "MouseEvent", "EventTarget", "console", "Text"] }

[profile.release]
panic = "unwind"

[profile.dev]
panic = "unwind"