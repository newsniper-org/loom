[package]
name = "loom-resume-demo"
edition.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ssr"
path = "src/bin/ssr.rs"

[dependencies]
bevy_ecs = "0.14"
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.3", features = ["wasm_js"] }
loom-runtime = { path = "../loom-runtime", features = ["browser"] }
wasm-bindgen = "0.2.126"
web-sys = { version = "0.3.103", features = ["Document", "Element", "Node", "Window", "console"] }

[build-dependencies]
loom-compiler = { path = "../loom-compiler" }
