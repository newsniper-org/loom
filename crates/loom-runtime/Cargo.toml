[package]
name = "loom-runtime"
edition.workspace = true
version.workspace = true

[dependencies]
bevy_ecs = "0.14"
js-sys = { version = "0.3.103", optional = true }
smallvec = "1"
wasm-bindgen = { version = "0.2.126", optional = true }
web-sys = { version = "0.3.103", features = ["Document", "Element", "Window", "Node", "NodeList", "HtmlElement", "Event", "MouseEvent", "EventTarget", "DomTokenList", "console", "Text", "CssStyleDeclaration"], optional = true }

[dev-dependencies]

[features]
# Real-browser `DomOps` implementation (`loom_runtime::web::BrowserDom`),
# shared by loom-demo and any future benchmark harness so neither has to
# hand-roll its own copy.
browser = ["dep:wasm-bindgen", "dep:web-sys", "dep:js-sys"]
