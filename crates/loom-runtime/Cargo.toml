[package]
name = "loom-runtime"
edition.workspace = true
version.workspace = true

[dependencies]
bevy_ecs.workspace = true
# RQ5 후보 #4 — Verus로 검증된 Chain(순서 재결선). place_in_order가 이것을
# 호출한다: 검증된 코드가 곧 배포되는 코드. vstd는 ghost가 컴파일 시점에
# 지워지므로 wasm32 빌드에 짐을 남기지 않는다(실측 확인).
loom-flush-core = { path = "../loom-flush-core" }
js-sys = { version = "0.3.103", optional = true }
smallvec = "1"
wasm-bindgen = { version = "0.2.126", optional = true }
# "Performance"는 stage.rs의 §7.1 단계 귀속 계측용 고해상도 시계
# (`performance.now()`) — RQ1-benchmark-protocol.md §8이 요구하는 타이머.
web-sys = { version = "0.3.103", features = ["Document", "Element", "Window", "Node", "NodeList", "HtmlCollection", "HtmlElement", "HtmlInputElement", "Event", "MouseEvent", "EventTarget", "DomTokenList", "console", "Text", "CharacterData", "CssStyleDeclaration", "Performance", "DocumentFragment"], optional = true }

[dev-dependencies]

[features]
# Real-browser `DomOps` implementation (`loom_runtime::web::BrowserDom`),
# shared by loom-demo and any future benchmark harness so neither has to
# hand-roll its own copy.
# (2026-10-17 갱신: "future benchmark harness"는 이제 실재한다 — loom-bench.
# 그 밖에 resume-demo, island-*, widget-embed*, largeapp-axis-* 등 브라우저
# 대상 크레이트 대부분이 이 feature를 켠다.)
browser = ["dep:wasm-bindgen", "dep:web-sys", "dep:js-sys"]

[profile.release]
panic = "unwind"

[profile.dev]
panic = "unwind"