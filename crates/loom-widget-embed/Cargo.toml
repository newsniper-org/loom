[package]
name = "loom-widget-embed"
edition.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy_ecs = "0.14"
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.3", features = ["wasm_js"] }
loom-runtime = { path = "../loom-runtime", features = ["browser"] }
wasm-bindgen = "0.2.126"
web-sys = { version = "0.3.103", features = ["Document", "Element", "Window", "Node", "HtmlElement", "HtmlCollection", "Event", "MouseEvent", "EventTarget", "console", "Text"] }

[build-dependencies]
loom-compiler = { path = "../loom-compiler" }
