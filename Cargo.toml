[workspace]
resolver = "2"
members = [
    "crates/loom-runtime",
    "crates/loom-compiler",
    "crates/loom-demo",
    "crates/loom-bench",
    "crates/loom-resume-demo",
    "crates/loom-island-demo",
    "crates/loom-island-productcard",
    "crates/loom-island-quantitypicker",
    "crates/loom-fic",
]

[workspace.package]
edition = "2021"
version = "0.0.1-phase1"

[profile.release]
opt-level = "s"
lto = true
